<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Home Designer</title>
    <link rel="stylesheet" href="auth.css">
      <link rel="icon" type="image/png" href="../../Icon.png">

</head>
<body>
    <div class="page-shell">
        <div class="auth-card">
            <div class="topbar">
                <a href="../home/index.html" class="back-link">← חזרה לדף הבית</a>
            </div>

            <div class="brand" aria-label="AI Home Designer">
                <span class="brand-icon" aria-hidden="true">A</span>
                <span><strong>Atelier</strong><small>AI HOME DESIGN</small></span>
            </div>

            <div class="access-mode" role="group" aria-label="בחירת סוג חשבון">
                <button class="mode-btn active" type="button" data-mode="User" aria-pressed="true">כניסת לקוחות</button>
                <button class="mode-btn" type="button" data-mode="Admin" aria-pressed="false">כניסת מנהלים</button>
            </div>
            <p class="mode-note" id="mode-note">היכנסו כדי להתחיל לתכנן את החלל שלכם.</p>

            <div class="tab-switch" id="tab-switch" role="tablist" aria-label="בחירת מצב התחברות">
                <button class="tab active" type="button" data-tab="login" aria-selected="true">התחברות</button>
                <button class="tab" type="button" data-tab="register" aria-selected="false">הרשמה</button>
            </div>

            <form id="login-form" class="auth-form active" novalidate>
                <h2>התחברות</h2>

                <label>
                    <span>מייל</span>
                    <input id="login-email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
                </label>

                <label>
                    <span>סיסמא</span>
                    <input id="login-password" name="password" type="password" placeholder="הקלד סיסמא" autocomplete="current-password" required>
                </label>

                <button type="submit" class="primary-btn">התחבר</button>
            </form>

            <form id="register-form" class="auth-form" novalidate>
                <h2>הרשמה</h2>

                <label>
                    <span>שם</span>
                    <input id="register-name" name="name" type="text" placeholder="שם מלא" autocomplete="name" required>
                </label>

                <label>
                    <span>מספר טלפון</span>
                    <input id="register-phone" name="phone" type="tel" placeholder="050-1234567" autocomplete="tel" required>
                </label>

                <label>
                    <span>מייל</span>
                    <input id="register-email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
                </label>

                <label>
                    <span>סיסמא</span>
                    <input id="register-password" name="password" type="password" placeholder="הקלד סיסמא" autocomplete="new-password" required>
                </label>

                <label>
                    <span>אימות סיסמא</span>
                    <input id="register-confirm-password" name="confirmPassword" type="password" placeholder="הקלד שוב את הסיסמא" autocomplete="new-password" required>
                </label>

                <button type="submit" class="primary-btn"><span>צור חשבון</span><span aria-hidden="true">↗</span></button>
            </form>

            <div id="auth-message" class="message" aria-live="polite"></div>
        </div>
    </div>

    <aside class="visual-panel" aria-label="חלל מגורים בעיצוב עכשווי">
        <div class="visual-photo visual-photo-detail" aria-hidden="true"></div>
        <div class="visual-topline"><span>01 / 03</span><span>DESIGN YOUR EVERYDAY</span></div>
        <div class="visual-copy">
            <p class="visual-kicker">הבית מתחיל ברעיון</p>
            <h1>חלל שנראה<br>כמוך.</h1>
            <p>מתארים את מה שחשוב. מקבלים כיוון עיצובי שנבנה סביב החיים שלכם.</p>
        </div>
        <div class="visual-caption"><span class="caption-mark"></span><span>חומר. אור. מקום.</span><span>AI INTERIOR STUDIO</span></div>
        <div class="visual-photo visual-photo-small" aria-hidden="true"></div>
    </aside>

    <script src="auth.js"></script>
    <script src="session.js"></script>
</body>
</html>
