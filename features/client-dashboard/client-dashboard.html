<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Home Designer</title>
  <link rel="stylesheet" href="client-dashboard.css">
  <link rel="stylesheet" href="../design-system.css">
    <link rel="icon" type="image/png" href="../../Icon.png">

</head>
<body class="client-dashboard">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🏡</span>
      <span>AI Home Designer</span>
    </div>
    <nav class="nav-links">
      <span class="user-name" id="current-user-name"></span>
      <a href="../home/index.html">דף הבית</a>
      <button id="logout-btn" class="ghost-btn" type="button">התנתקות</button>
    </nav>
  </header>

  <main class="dashboard-shell">
    <section class="client-welcome" aria-label="אזור ההדמיות האישי">
      <img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1600&q=88" alt="סלון מואר עם ריהוט עכשווי וגוונים טבעיים">
      <div>
        <p class="eyebrow">המרחב האישי שלך</p>
        <h1>רעיונות טובים<br>מתחילים בבית.</h1>
        <p>כל ההדמיות, ההשראות והבחירות שלך במקום אחד.</p>
      </div>
      <span class="client-welcome-index" aria-hidden="true">ATELIER / 01</span>
    </section>

    <section class="summary-cards">
      <div class="card">
        <span class="label">ההדמיות שלי</span>
        <strong id="design-count">0</strong>
      </div>
      <div class="card">
        <span class="label">תקציב ממוצע</span>
        <strong id="avg-budget">0 ₪</strong>
      </div>
      <div class="card">
        <span class="label">סגנון מועדף</span>
        <strong id="favorite-style">-</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">החשבון שלי</p>
          <h1>הדמיות</h1>
        </div>
      </div>
    </section>

    <section class="panel list-panel">
      <div class="panel-header compact">
        <div>
          <p class="eyebrow">רשימה</p>
          <h2>ההדמיות שלי</h2>
        </div>
      </div>
      <div id="design-list" class="design-list"></div>
    </section>
  </main>

  <script src="client-dashboard.js"></script>
  <script src="../auth/session.js"></script>
</body>
</html>
